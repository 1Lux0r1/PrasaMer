<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Навигация колоды</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Слайды" style="width: 1920px; height: 76px; box-sizing: border-box; padding: 0 56px 12px; display: flex; align-items: center; justify-content: space-between; font-family: 'Onest', system-ui, sans-serif; color: #ffffff">
  <div style="display: flex; gap: 2px; padding: 4px; border-radius: 28px; background: rgba(22,29,43,0.82); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="height: 48px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 9px; border-radius: 24px; background: {{tab.bg}}; text-decoration: none; color: {{tab.color}}; font-size: 17px; font-weight: {{tab.weight}}; white-space: nowrap">
        <span style="font-size: 12px; font-weight: 600; color: {{tab.numColor}}">{{tab.num}}</span>
        <span>{{tab.name}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 18px">
    <button type="button" data-fullscreen aria-label="Во весь экран" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="fill: none; stroke: #C5CEDB; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5"></path></svg>
    </button>
    <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: #C5CEDB">{{counter}}</div>
    <div style="display: flex; gap: 2px; padding: 4px; border-radius: 28px; background: rgba(22,29,43,0.82); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)">
      <a href="{{prevHref}}" aria-label="Предыдущий слайд" style="width: 56px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M11 4L6 9l5 5"></path></svg>
      </a>
      <a href="{{nextHref}}" aria-label="Следующий слайд" style="width: 56px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; background: rgba(255,255,255,0.16)">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M7 4l5 5-5 5"></path></svg>
      </a>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"int","default":2,"min":1,"max":5},"$preview":{"width":1920,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = Math.max(1, Math.min(5, Number((this.props && this.props.current) ?? 1) || 1)) - 1;
    const slides = [
      ['О системе', 'PowerAbout.dc.html'],
      ['Данные', 'PowerData.dc.html'],
      ['Карта ↔ схема', 'PowerScheme.dc.html'],
      ['Область применения', 'PowerTasks.dc.html'],
      ['Эффект', 'PowerEffect.dc.html']
    ];
    return {
      tabs: slides.map((s, i) => ({
        num: '0' + (i + 1), name: s[0], href: s[1],
        bg: i === cur ? 'rgba(255,255,255,0.16)' : 'transparent',
        color: i === cur ? '#ffffff' : '#C5CEDB',
        weight: i === cur ? 700 : 500,
        numColor: i === cur ? '#FF8A99' : '#A7B2C2'
      })),
      counter: '0' + (cur + 1) + ' / 0' + slides.length,
      prevHref: slides[(cur + slides.length - 1) % slides.length][1],
      nextHref: slides[(cur + 1) % slides.length][1]
    };
  }
}
</script>
</body>
</html>
