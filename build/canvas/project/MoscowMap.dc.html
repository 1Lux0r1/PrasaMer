<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта Москвы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #182233; font-family: 'Onest', system-ui, sans-serif; color: #ffffff">
  <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
    <path d="{{dBlobs}}" style="fill: #121926; opacity: 0.8"></path>
    <path d="{{dCity}}" style="fill: #10151f"></path>
    <path d="{{dRiver}}" style="fill: none; stroke: #1b3346; stroke-width: {{wRiver}}; stroke-linecap: round; stroke-linejoin: round"></path>
  </svg>

  <sc-if value="{{isDim}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
      <path d="{{dOuter}}" style="fill: none; stroke: #212b3c; stroke-width: {{wMinor}}"></path>
      <path d="{{dMinorAll}}" style="fill: none; stroke: #222c3d; stroke-width: {{wMinor}}"></path>
      <path d="{{dMajorAll}}" style="fill: none; stroke: #2d394d; stroke-width: {{wMajor}}"></path>
      <path d="{{dCity}}" style="fill: none; stroke: #334058; stroke-width: {{wRing}}"></path>
    </svg>
  </sc-if>

  <sc-if value="{{isNetwork}}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
      <path d="{{dRiver}}" style="fill: none; stroke: #2f6f7c; stroke-width: 1.2; opacity: 0.8"></path>
      <path d="{{dOuter}}" style="fill: none; stroke: #EADFB4; stroke-width: {{wMinor}}; opacity: 0.2"></path>
      <path d="{{n0}}" style="fill: none; stroke: #EADFB4; stroke-width: {{wMinor}}; opacity: 0.45"></path>
      <path d="{{n1}}" style="fill: none; stroke: #7CCFD0; stroke-width: {{wMinor}}; opacity: 0.45"></path>
      <path d="{{n2}}" style="fill: none; stroke: #E39AAE; stroke-width: {{wMinor}}; opacity: 0.45"></path>
      <path d="{{n3}}" style="fill: none; stroke: #9BDDB0; stroke-width: {{wMinor}}; opacity: 0.45"></path>
      <path d="{{n4}}" style="fill: none; stroke: #F0B37E; stroke-width: {{wMinor}}; opacity: 0.45"></path>
      <path d="{{m0}}" style="fill: none; stroke: #EADFB4; stroke-width: {{wMajor}}; opacity: 0.9; filter: drop-shadow(0 0 4px rgba(234,223,180,0.55))"></path>
      <path d="{{m1}}" style="fill: none; stroke: #7CCFD0; stroke-width: {{wMajor}}; opacity: 0.9; filter: drop-shadow(0 0 4px rgba(124,207,208,0.55))"></path>
      <path d="{{m2}}" style="fill: none; stroke: #E39AAE; stroke-width: {{wMajor}}; opacity: 0.9; filter: drop-shadow(0 0 4px rgba(227,154,174,0.55))"></path>
      <path d="{{m3}}" style="fill: none; stroke: #9BDDB0; stroke-width: {{wMajor}}; opacity: 0.9; filter: drop-shadow(0 0 4px rgba(155,221,176,0.55))"></path>
      <path d="{{m4}}" style="fill: none; stroke: #F0B37E; stroke-width: {{wMajor}}; opacity: 0.9; filter: drop-shadow(0 0 4px rgba(240,179,126,0.55))"></path>
      <path d="{{dCity}}" style="fill: none; stroke: #F2EAD0; stroke-width: {{wRing}}; filter: drop-shadow(0 0 5px rgba(242,234,208,0.6))"></path>
      <path d="{{dNodes}}" style="fill: #ffffff; opacity: 0.95"></path>
    </svg>
  </sc-if>

  <sc-if value="{{ring}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
      <path d="{{dGreen}}" style="fill: none; stroke: #5FD6A2; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(95,214,162,0.75))"></path>
      <path d="{{dFade}}" style="fill: none; stroke: #F4F1E6; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(244,241,230,0.6))"></path>
      <path d="{{dOrange}}" style="fill: none; stroke: #F5A04A; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(245,160,74,0.75))"></path>
      <path d="{{dDotsG}}" style="fill: #5FD6A2"></path>
      <path d="{{dDotsO}}" style="fill: #F5A04A"></path>
    </svg>
  </sc-if>

  <sc-if value="{{zone}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
      <circle cx="{{mx}}" cy="{{my}}" r="{{zoneR}}" style="fill: rgba(255,45,70,0.12); stroke: #FF2D46; stroke-width: 2; stroke-dasharray: 10 8"></circle>
    </svg>
  </sc-if>

  <sc-if value="{{marker}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 1920 1080" width="1920" height="1080" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
      <circle cx="{{mx}}" cy="{{my}}" r="24" style="fill: rgba(255,45,70,0.1); stroke: #FF2D46; stroke-width: 1.5; opacity: 0.8"></circle>
      <circle cx="{{mx}}" cy="{{my}}" r="8" style="fill: #FF2D46; stroke: #ffffff; stroke-width: 2.5"></circle>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["network","dim"],"default":"network"},"cx":{"editor":"int","default":960,"min":0,"max":1920},"cy":{"editor":"int","default":540,"min":0,"max":1080},"scale":{"editor":"int","default":400,"min":200,"max":1400},"ring":{"editor":"boolean","default":false},"marker":{"editor":"boolean","default":false},"zone":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  build(cx, cy, R) {
    let s = 20260;
    const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
    const TAU = Math.PI * 2;
    const rf = (t) => 1 - 0.05 * Math.cos(2 * t) + 0.025 * Math.cos(3 * t + 0.8) + 0.015 * Math.sin(5 * t + 0.3);
    const P = (t, f) => {
      const r = R * f * (1 + Math.min(f, 1) * (rf(t) - 1));
      return [cx + r * Math.cos(t), cy + r * Math.sin(t)];
    };
    const fmt = (q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
    const line = (pts) => 'M' + pts.map(fmt).join('L');
    const arc = (f, t0, t1) => {
      const n = Math.max(2, Math.ceil(Math.abs(t1 - t0) / 0.05));
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push(P(t0 + (t1 - t0) * i / n, f));
      return line(pts);
    };
    const radial = (t, f0, f1, wob) => {
      const n = Math.max(1, Math.ceil((f1 - f0) / 0.07));
      const pts = [];
      let tt = t, last = t;
      for (let i = 0; i <= n; i++) {
        last = tt;
        pts.push(P(tt, f0 + (f1 - f0) * i / n));
        tt += (rnd() - 0.5) * wob;
      }
      return [line(pts), last];
    };
    const dot = (q, r) => 'M' + (q[0] - r).toFixed(1) + ' ' + q[1].toFixed(1) +
      'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';

    const major = [[], [], [], [], []], minor = [[], [], [], [], []], outer = [], nodes = [];
    const k = Math.max(1, Math.min(2.2, R / 400));

    [0.055, 0.12, 0.19, 0.36].forEach((f, i) => major[(i + 1) % 5].push(arc(f, 0, TAU) + 'Z'));
    for (let i = 0; i < 5; i++) {
      const t0 = rnd() * TAU;
      major[i % 5].push(arc(0.56 + rnd() * 0.14, t0, t0 + 0.7 + rnd() * 0.8));
    }
    const N = 22;
    for (let i = 0; i < N; i++) {
      const t = (i + (rnd() - 0.5) * 0.5) / N * TAU;
      const f0 = [0.12, 0.19, 0.19, 0.36][Math.floor(rnd() * 4)];
      const r = radial(t, f0, 1, 0.03);
      major[i % 5].push(r[0]);
      nodes.push(dot(P(r[1], 1), +(2.4 * k).toFixed(1)));
      outer.push(radial(r[1], 1, 1.5 + rnd() * 1.2, 0.05)[0]);
    }
    for (let i = 0; i < 80; i++) {
      const f = 0.22 + rnd() * 0.76, t0 = rnd() * TAU;
      minor[Math.floor(rnd() * 5)].push(arc(f, t0, t0 + 0.2 + rnd() * 0.8));
    }
    for (let i = 0; i < 120; i++) {
      const t = rnd() * TAU, f0 = 0.14 + rnd() * 0.7;
      minor[Math.floor(rnd() * 5)].push(radial(t, f0, Math.min(1, f0 + 0.08 + rnd() * 0.28), 0.04)[0]);
    }
    for (let i = 0; i < 6; i++) {
      const t0 = rnd() * TAU;
      outer.push(arc(1.25 + rnd() * 0.75, t0, t0 + 0.3 + rnd() * 0.6));
    }

    const blobs = [];
    [[0.35, 1.12, 0.2], [1.2, 1.05, 0.16], [2.2, 1.2, 0.3], [2.9, 1.1, 0.18], [3.6, 1.25, 0.26], [4.3, 1.08, 0.14], [5.0, 1.15, 0.2], [5.75, 1.3, 0.24], [2.45, 1.75, 0.35]].forEach((b) => {
      const c = P(b[0], b[1]);
      const pts = [];
      for (let i = 0; i < 18; i++) {
        const a = i / 18 * TAU, rr = R * b[2] * (0.65 + rnd() * 0.7);
        pts.push([c[0] + rr * Math.cos(a), c[1] + rr * Math.sin(a)]);
      }
      blobs.push(line(pts) + 'Z');
    });

    const RV = [[-1.3, -0.3], [-1.02, -0.24], [-0.82, -0.1], [-0.72, -0.3], [-0.56, -0.2], [-0.6, 0], [-0.42, 0.06], [-0.36, -0.12], [-0.22, 0.02], [-0.28, 0.2], [-0.12, 0.23], [-0.05, 0.08], [0.06, 0.1], [0.13, 0.25], [0.05, 0.4], [0.2, 0.46], [0.35, 0.36], [0.43, 0.5], [0.31, 0.62], [0.46, 0.72], [0.66, 0.7], [0.8, 0.86], [1.05, 0.96], [1.4, 1.2]]
      .map((q) => [cx + q[0] * R, cy + q[1] * R]);
    let dRiver = 'M' + fmt(RV[0]);
    for (let i = 0; i < RV.length - 1; i++) {
      const p0 = RV[Math.max(0, i - 1)], p1 = RV[i], p2 = RV[i + 1], p3 = RV[Math.min(RV.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      dRiver += 'C' + fmt(c1) + ' ' + fmt(c2) + ' ' + fmt(p2);
    }

    const A = (i) => (-10 + 25.5 * i) * Math.PI / 180;
    const dg = [], dor = [];
    for (let i = 0; i < 14; i++) (i < 11 ? dg : dor).push(dot(P(A(i), 1), 6));
    const m = P(0.42, 0.5);

    return {
      dCity: arc(1, 0, TAU) + 'Z',
      dBlobs: blobs.join(''),
      dRiver: dRiver,
      dOuter: outer.join(''),
      dNodes: nodes.join(''),
      m0: major[0].join(''), m1: major[1].join(''), m2: major[2].join(''), m3: major[3].join(''), m4: major[4].join(''),
      n0: minor[0].join(''), n1: minor[1].join(''), n2: minor[2].join(''), n3: minor[3].join(''), n4: minor[4].join(''),
      dMajorAll: major.map((g) => g.join('')).join(''),
      dMinorAll: minor.map((g) => g.join('')).join(''),
      dGreen: arc(1, A(0), A(10)),
      dFade: arc(1, A(10), A(11) - 0.07),
      dOrange: arc(1, A(11) - 0.07, A(13)),
      dDotsG: dg.join(''),
      dDotsO: dor.join(''),
      mx: m[0].toFixed(1), my: m[1].toFixed(1),
      zoneR: (R * 0.17).toFixed(1),
      wMajor: (1.6 * k).toFixed(2), wMinor: (0.9 * k).toFixed(2), wRing: (2.2 * k).toFixed(2), wRiver: (6 * k).toFixed(1)
    };
  }
  renderVals() {
    const p = this.props || {};
    const on = (v) => v === true || v === 'true';
    const cx = Number(p.cx ?? 960), cy = Number(p.cy ?? 540), R = Number(p.scale ?? 400);
    const key = cx + '|' + cy + '|' + R;
    if (this._key !== key) { this._geo = this.build(cx, cy, R); this._key = key; }
    const dim = (p.mode ?? 'network') === 'dim';
    return Object.assign({}, this._geo, {
      isDim: dim, isNetwork: !dim,
      ring: on(p.ring), marker: on(p.marker), zone: on(p.zone)
    });
  }
}
</script>
</body>
</html>
