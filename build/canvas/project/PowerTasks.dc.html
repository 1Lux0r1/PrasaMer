<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Область применения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #161d2b; font-family: 'Onest', system-ui, sans-serif; color: #ffffff">
  <div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">
    <dc-import name="MoscowMap" mode="dim" cx="330" cy="620" scale="560" hint-size="1920px,1080px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(180deg, rgba(22,29,43,0.97) 0%, rgba(22,29,43,0.9) 30%, rgba(22,29,43,0.72) 62%, rgba(22,29,43,0.92) 100%); pointer-events: none"></div>
  <div style="position: absolute; left: 0; top: 1004px; width: 1920px; height: 76px">
    <dc-import name="PowerNav" current="4" hint-size="1920px,76px"></dc-import>
  </div>

  <header style="position: absolute; left: 96px; top: 36px; width: 1300px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 14px; font-size: 18px; font-weight: 700; letter-spacing: 0.06em">
      <span aria-hidden="true" style="width: 6px; height: 20px; background: #FF2D46"></span>
      ОБЛАСТЬ ПРИМЕНЕНИЯ
    </div>
    <h1 style="margin: 0; font-size: 48px; line-height: 1.12; font-weight: 800; letter-spacing: -0.01em">Примеры <span style="color: #FF3D55">будущего функционала</span></h1>
  </header>

  <div style="position: absolute; right: 96px; top: 44px; height: 76px; box-sizing: border-box; padding: 0 34px 0 28px; border-radius: 20px; border: 1px solid rgba(230,215,42,0.55); background: rgba(230,215,42,0.10); box-shadow: 0 0 26px rgba(230,215,42,0.14), inset 0 1px 0 rgba(255,255,255,0.10); display: flex; align-items: center; gap: 16px">
    <span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 50%; background: #F2E76A; box-shadow: 0 0 0 6px rgba(230,215,42,0.18), 0 0 14px rgba(230,215,42,0.9)"></span>
    <span style="font-size: 30px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; color: #F2E76A">План на 2027</span>
  </div>

  <div class="task-list" aria-label="Сценарии применения">
    <button type="button" class="task-card" data-demo="outage" aria-controls="demo-outage" aria-pressed="false">
      <span class="task-number">01</span>
      <span class="task-title">Последствия аварий и переключения</span>
      <span class="task-desc">Кто останется без электроснабжения и как переключить потребителей</span>
      <span class="task-arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </button>

    <button type="button" class="task-card" data-demo="forecast" aria-controls="demo-forecast" aria-pressed="false">
      <span class="task-number">02</span>
      <span class="task-title">Прогноз потребления города</span>
      <span class="task-desc">Ожидаемая нагрузка с учётом погоды и состояния оборудования</span>
      <span class="task-arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </button>

    <button type="button" class="task-card" data-demo="planning" aria-controls="demo-planning" aria-pressed="false">
      <span class="task-number">03</span>
      <span class="task-title">Планирование застройки</span>
      <span class="task-desc">Хватит ли резервов сети и источника для новых объектов</span>
      <span class="task-arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </button>
  </div>

  <div class="demo-workspace" id="demo-workspace">
    <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><path d="M8 15h42M8 43h42M17 15v28M41 15v28M29 6v18M29 34v18"></path></svg>
    <span>Выберите блок слева</span>
    <p>Интерактивная демонстрация откроется здесь</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
