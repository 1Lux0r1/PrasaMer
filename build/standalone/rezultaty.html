<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Результаты работы — цифровизация ресурсоснабжения Москвы</title>
<!--FONTS-->
<style>
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #0d1118; color: #ffffff; font-family: 'Onest', system-ui, sans-serif; }
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #8FB4F0; outline-offset: 2px; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #1b2435; transform-origin: center center; }

/* геоподложка: карта Москвы, центр города совпадает с центром круга */
.geo { position: absolute; left: 272px; top: -22px; width: 2000px; height: 1175px; mix-blend-mode: lighten; filter: brightness(1.35) saturate(0.8); opacity: 0.6; }
.shade { position: absolute; inset: 0; background:
  radial-gradient(circle 190px at 1316px 540px, rgba(27,36,53,0.78) 40%, rgba(27,36,53,0) 100%),
  linear-gradient(180deg, #1b2435 0, rgba(27,36,53,0.9) 130px, rgba(27,36,53,0) 230px),
  radial-gradient(ellipse 640px 620px at 1316px 528px, rgba(27,36,53,0) 42%, rgba(27,36,53,0.7) 72%, #1b2435 100%),
  linear-gradient(90deg, #1b2435 0, #1b2435 600px, rgba(27,36,53,0) 900px); }

.logos { position: absolute; left: 82px; top: 36px; height: 60px; display: flex; align-items: center; gap: 36px; }
.logo { display: flex; align-items: center; gap: 12px; font-weight: 800; line-height: 1; }
.logo i { flex: none; display: block; }
.logo.cgu { font-size: 32px; letter-spacing: 0.04em; }
.logo.cgu i { width: 34px; height: 40px; background: #FF2D46; clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 78%, 62% 100%, 0 100%); }
.logo.mos { font-size: 21px; line-height: 0.95; }
.logo.mos i { width: 56px; height: 56px; border-radius: 50%; background: #C8102E; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9); }

.tabs { position: absolute; left: 476px; right: 46px; top: 44px; height: 82px; display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid rgba(255,255,255,0.14); }
.tab { position: relative; padding: 0; border: 0; background: none; text-align: left; display: flex; gap: 12px; align-items: flex-start; }
.tab svg { flex: none; margin-top: 8px; fill: none; stroke: #A7B2C2; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab small { display: block; font-size: 14px; color: #8794A8; }
.tab b { display: block; margin-top: 6px; font-size: 16px; font-weight: 700; color: #C5CEDB; white-space: nowrap; }
.tab::after { content: ''; position: absolute; left: 118px; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: #4A586E; }
.tab:hover b, .tab.on b { color: #ffffff; }
.tab.on::after { background: #5FD6A2; box-shadow: 0 0 10px rgba(95,214,162,0.9); }

h1 { position: absolute; left: 82px; top: 272px; margin: 0; font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
.lead { position: absolute; left: 82px; top: 468px; width: 600px; margin: 0; font-size: 44px; line-height: 1.24; color: #C5CEDB; }
.year { position: absolute; left: 82px; top: 658px; margin: 0; font-size: 30px; color: #C5CEDB; }
.year b { color: #ffffff; font-weight: 800; }
.bar { position: absolute; left: 82px; top: 734px; width: 92px; height: 9px; background: #FF2D46; transform: skewX(-32deg); }
.legend { position: absolute; left: 82px; top: 884px; display: flex; gap: 30px; font-size: 16px; color: #A7B2C2; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 20px; height: 3px; border-radius: 2px; }

.pill { position: absolute; top: 984px; height: 62px; box-sizing: border-box; border-radius: 31px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: center; font-size: 21px; color: #C5CEDB; }
.tools { position: absolute; right: 82px; top: 980px; height: 70px; display: flex; align-items: center; gap: 22px; font-size: 16px; color: #A7B2C2; }
.tools button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; }
.tools button:hover { background: rgba(255,255,255,0.1); }
.tools svg { fill: none; stroke: #C5CEDB; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tools .nav { width: 140px; height: 70px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: space-around; }

/* круг с блоками */
.ring { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.core { position: absolute; left: 1166px; top: 468px; width: 300px; text-align: center; }
.core svg { fill: none; stroke: #8FA6C4; stroke-width: 1.6; stroke-linejoin: round; }
.core b { display: block; margin-top: 12px; font-size: 21px; line-height: 1.2; font-weight: 700; color: #B9C6D8; }
.core span { display: block; margin-top: 10px; font-size: 15px; color: #8794A8; }
.sec { position: absolute; padding: 12px 18px; border: 1px solid transparent; border-radius: 16px; background: rgba(27,36,53,0.82); display: flex; align-items: center; gap: 16px; text-align: left; font-size: 25px; line-height: 1.25; color: #ffffff; white-space: nowrap; transition: background .2s, border-color .2s, box-shadow .2s; }
.sec b { font-size: 36px; font-weight: 800; color: #5FD6A2; }
.sec.plan b { color: #F5A04A; }
.sec:hover, .sec.on { background: rgba(41,56,78,0.94); border-color: rgba(255,255,255,0.22); box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.10); }
</style>
</head>
<body>
<div id="stage">
  <img class="geo" src="img/moscow-base.svg" alt="">
  <div class="shade"></div>

  <div class="logos">
    <div class="logo cgu"><i></i>ЦГУ</div>
    <div class="logo mos"><i></i><span>Мос<br>Инженерия</span></div>
  </div>

  <nav class="tabs">
    <button class="tab" data-s="1"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v6.5M12 15.5V22M2 12h6.5M15.5 12H22"/></svg><span><small>01</small><b>Инженерный каркас</b></span></button>
    <button class="tab" data-s="2"><svg width="26" height="26" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 13a4 4 0 0 1 8 0M12 13l2-3"/></svg><span><small>02</small><b>Учет ресурсов</b></span></button>
    <button class="tab" data-s="3"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-4 1-7 2-9.500z"/></svg><span><small>03</small><b>Теплоснабжение</b></span></button>
    <button class="tab" data-s="4"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12z"/><path d="M12 13s2.500 2 2.500 4a2.500 2.500 0 0 1-5 0c0-2 2.500-4 2.500-4z"/></svg><span><small>04</small><b>Газоснабжение</b></span></button>
    <button class="tab" data-s="5"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.500 12h6M9.500 16h6"/></svg><span><small>05</small><b>АРМ КСИО</b></span></button>
    <button class="tab" data-s="6"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M13 2 5 13.500h6L10 22l9-12h-6.500z"/></svg><span><small>06</small><b>CIM-модель</b></span></button>
  </nav>

  <h1>Результаты<br>работы</h1>
  <p class="lead">Цифровизация сферы ресурсоснабжения города Москвы</p>
  <p class="year">за <b>2026</b> г.</p>
  <div class="bar"></div>
  <div class="legend"><span><i style="background:#5FD6A2"></i>Разделы результатов</span><span><i style="background:#F5A04A"></i>Планы на 2027</span></div>

  <div class="pill" style="left: 82px; width: 190px">Москва 2026</div>
  <div class="pill" style="left: 290px; width: 62px; font-size: 26px">?</div>
  <div class="tools">
    <button aria-label="Все слайды"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    <button id="full" aria-label="На весь экран"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <span>01 / 20</span>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" style="opacity:.35"><path d="M15 5l-7 7 7 7"/></svg><svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
  </div>

  <svg class="ring" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="1034" y1="380" x2="1250" y2="230"><stop offset="0" stop-color="#F5A04A"/><stop offset="1" stop-color="#5FD6A2"/></linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <ellipse cx="1316" cy="528" rx="282" ry="299" fill="rgba(27,36,53,0.28)"/>
    <ellipse cx="1316" cy="528" rx="282" ry="299" fill="none" stroke="#5FD6A2" stroke-width="6" opacity="0.45" filter="url(#glow)"/>
    <ellipse cx="1316" cy="528" rx="282" ry="299" fill="none" stroke="#5FD6A2" stroke-width="3"/>
    <path d="M1047 440 A282 299 0 0 1 1230 243" fill="none" stroke="url(#rg)" stroke-width="3.500"/>
    <g fill="#5FD6A2">
      <circle cx="1323" cy="229" r="7"/><circle cx="1564" cy="668" r="7"/>
      <circle cx="1333" cy="827" r="7"/><circle cx="1087" cy="703" r="7"/>
    </g>
    <circle cx="1047" cy="440" r="7" fill="#F5A04A"/>
  </svg>

  <div class="core">
    <svg width="46" height="46" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
    <b>Цифровая модель ресурсоснабжения</b>
    <span>Выберите раздел</span>
  </div>

  <button class="sec" data-s="1" style="left: 1162px; top: 158px"><b>01</b><span>Инженерный каркас города</span></button>
  <button class="sec" data-s="2" style="left: 1570px; top: 386px"><b>02</b><span>Учет потребления<br>ресурсов</span></button>
  <button class="sec" data-s="3" style="left: 1534px; top: 716px"><b>03</b><span>Анализ территории<br>Теплоснабжение</span></button>
  <button class="sec" data-s="4" style="left: 1144px; top: 884px"><b>04</b><span>Анализ территории<br>Газоснабжение</span></button>
  <button class="sec plan" data-s="5" style="left: 824px; top: 736px"><b>05</b><span>АРМ инженера<br>КСИО</span></button>
  <button class="sec plan on" data-s="6" style="left: 786px; top: 378px"><b>06</b><span>CIM-модель<br>электроснабжения<br>Москвы</span></button>
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')'; }
  addEventListener('resize', fit); fit();
  document.getElementById('full').onclick = function () { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
  // наведение на раздел подсвечивает его и вкладку в шапке
  var items = [].slice.call(document.querySelectorAll('[data-s]'));
  function pick(s) { items.forEach(function (e) { e.classList.toggle('on', e.dataset.s === s); }); }
  items.forEach(function (e) { e.onmouseenter = e.onfocus = function () { pick(e.dataset.s); }; });
  pick('6');
})();
</script>
</body>
</html>
