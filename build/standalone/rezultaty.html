<!doctype html>
<html lang="ru">
<head>

<title>Результаты работы — цифровизация ресурсоснабжения Москвы</title>
<!--FONTS-->
<style>
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #0d1118; color: #ffffff; font-family: 'Onest', system-ui, sans-serif; }
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #8FB4F0; outline-offset: 2px; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #1b2435; transform-origin: center center; }

/* сцена: карта лежит плоскостью под 45°, вид с высоты птичьего полёта */
@property --tilt { syntax: '<angle>'; inherits: true; initial-value: 45deg; }
@property --zoom { syntax: '<number>'; inherits: true; initial-value: 1; }
.scene { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 1210px 520px; --tilt: 45deg; --zoom: 1; animation: fly 2.6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes fly { from { --tilt: 0deg; --zoom: 0.62; opacity: 0; } 35% { opacity: 1; } to { --tilt: 45deg; --zoom: 1; opacity: 1; } }
.plane { position: absolute; left: 510px; top: -90px; width: 1400px; height: 1400px; transform: rotateX(var(--tilt)) scale(var(--zoom)); transform-style: preserve-3d; }
.ground { position: absolute; inset: 0; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 34%, rgba(0,0,0,0.55) 46%, transparent 62%); mask-image: radial-gradient(circle at 50% 50%, #000 34%, rgba(0,0,0,0.55) 46%, transparent 62%); }
.grid { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(143,180,240,0.07) 0 1px, transparent 1px 70px), repeating-linear-gradient(90deg, rgba(143,180,240,0.07) 0 1px, transparent 1px 70px); }
.geo { position: absolute; left: -344px; top: 150px; width: 2000px; height: 1175px; opacity: 0.62; filter: brightness(1.5) saturate(0.85); }
.sweep { position: absolute; left: 280px; top: 280px; width: 840px; height: 840px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(95,214,162,0) 0deg, rgba(95,214,162,0) 300deg, rgba(95,214,162,0.20) 358deg, rgba(95,214,162,0) 360deg); animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.lights i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #BFD6FF; box-shadow: 0 0 8px 2px rgba(143,180,240,0.8); opacity: 0; animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 0.9; } }
.shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #1b2435 0, #1b2435 380px, rgba(27,36,53,0) 640px), linear-gradient(180deg, #1b2435 0, rgba(27,36,53,0.9) 130px, rgba(27,36,53,0) 220px); }

.logos { position: absolute; left: 82px; top: 36px; height: 60px; display: flex; align-items: center; gap: 36px; }
.logo { display: flex; align-items: center; gap: 12px; font-weight: 800; line-height: 1; }
.logo i { flex: none; display: block; }
.logo.cgu { font-size: 32px; letter-spacing: 0.04em; }
.logo.cgu i { width: 34px; height: 40px; background: #FF2D46; clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 78%, 62% 100%, 0 100%); }
.logo.mos { font-size: 21px; line-height: 0.95; }
.logo.mos i { width: 56px; height: 56px; border-radius: 50%; background: #C8102E; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9); }

.tabs { position: absolute; left: 476px; right: 46px; top: 44px; height: 82px; display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid rgba(255,255,255,0.14); }
.tab { position: relative; padding: 0; border: 0; background: none; text-align: left; display: flex; gap: 12px; align-items: flex-start; }
.tab svg { flex: none; margin-top: 8px; fill: none; stroke: #A7B2C2; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab small { display: block; font-size: 14px; color: #8794A8; }
.tab b { display: block; margin-top: 6px; font-size: 16px; font-weight: 700; color: #C5CEDB; white-space: nowrap; }
.tab::after { content: ''; position: absolute; left: 118px; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: #4A586E; }
.tab:hover b, .tab.on b { color: #ffffff; }
.tab.on::after { background: #5FD6A2; box-shadow: 0 0 10px rgba(95,214,162,0.9); }

h1 { position: absolute; left: 82px; top: 272px; margin: 0; font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
.lead { position: absolute; left: 82px; top: 468px; width: 480px; margin: 0; font-size: 44px; line-height: 1.24; color: #C5CEDB; }
.year { position: absolute; left: 82px; top: 658px; margin: 0; font-size: 30px; color: #C5CEDB; }
.year b { color: #ffffff; font-weight: 800; }
.bar { position: absolute; left: 82px; top: 734px; width: 92px; height: 9px; background: #FF2D46; transform: skewX(-32deg); }
.legend { position: absolute; left: 82px; top: 884px; display: flex; gap: 30px; font-size: 16px; color: #A7B2C2; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 20px; height: 3px; border-radius: 2px; }

.pill { position: absolute; top: 984px; height: 62px; box-sizing: border-box; border-radius: 31px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: center; font-size: 21px; color: #C5CEDB; }
.tools { position: absolute; right: 82px; top: 980px; height: 70px; display: flex; align-items: center; gap: 22px; font-size: 16px; color: #A7B2C2; }
.tools button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; }
.tools button:hover { background: rgba(255,255,255,0.1); }
.tools svg { fill: none; stroke: #C5CEDB; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tools .nav { width: 140px; height: 70px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: space-around; }

/* оглавление: маршрут 01 → 06 лежит на карте, разделы стоят над ней маяками */
.net { position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; overflow: visible; pointer-events: none; }
.net path, .net circle { fill: none; stroke-linecap: round; }
.net .base { stroke-width: 4; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; animation-delay: calc(1.5s + var(--i) * .28s); }
.net .glow { stroke-width: 14; opacity: 0.22; filter: blur(8px); stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease-out forwards; animation-delay: calc(1.5s + var(--i) * .28s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.net .run { stroke-width: 7; stroke: #ffffff; stroke-dasharray: 2 46; opacity: 0; animation: run 1.5s linear infinite, show .6s 3.4s forwards; }
@keyframes run { to { stroke-dashoffset: -48; } }
@keyframes show { to { opacity: 0.95; } }
.net .arrow { stroke: none; fill: #ffffff; opacity: 0; animation: show .5s forwards; animation-delay: calc(1.9s + var(--i) * .28s); }
.net .spoke { stroke-width: 2; stroke-dasharray: 2 12; opacity: 0; animation: show .8s 3.2s forwards, data 1.4s linear infinite; }
@keyframes data { to { stroke-dashoffset: -14; } }
.net .orbit { stroke: rgba(255,84,104,0.8); stroke-width: 2; stroke-dasharray: 10 14; transform-origin: 700px 700px; animation: spin 14s linear infinite; }
.net .pad { fill: rgba(255,45,70,0.10); stroke: rgba(255,84,104,0.5); stroke-width: 1.5; }
.net .pulse { stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse 2.6s ease-out infinite; animation-delay: calc(2.4s + var(--i) * .4s); }
@keyframes pulse { 0% { transform: scale(0.3); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
.net .foot { stroke: none; opacity: 0; animation: show .4s forwards; animation-delay: calc(1.5s + var(--i) * .28s); }

/* маяк: точка на карте → световой столб → значок раздела, всегда лицом к зрителю */
.post { position: absolute; width: 2px; height: 2px; margin: -1px 0 0 -1px; transform: rotateX(calc(-1 * var(--tilt))); transform-origin: 1px 1px; transform-style: preserve-3d; }
.post .stem { position: absolute; left: -2px; bottom: 0; width: 4px; height: 112px; border-radius: 2px; background: linear-gradient(0deg, var(--c), color-mix(in srgb, var(--c) 0%, transparent)); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 70%, transparent); transform-origin: 50% 100%; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(1.6s + var(--i) * .28s); }
@keyframes rise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.sec { position: absolute; left: 0; bottom: 104px; padding: 0; border: 0; background: none; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 22px; line-height: 1.22; color: #ffffff; white-space: nowrap; transform: translateX(-40px); animation: pop .55s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1.85s + var(--i) * .28s); }
.sec.l { left: auto; right: 0; flex-direction: row-reverse; text-align: right; transform: translateX(40px); }
@keyframes pop { from { opacity: 0; scale: 0.4; translate: 0 30px; } to { opacity: 1; scale: 1; translate: 0 0; } }
.sec .ic { flex: none; width: 80px; height: 80px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--c); background: radial-gradient(circle at 50% 30%, #2f3f5a 0%, #151c2a 80%); box-shadow: 0 0 0 6px rgba(27,36,53,0.85), 0 0 26px color-mix(in srgb, var(--c) 55%, transparent), inset 0 1px 0 rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; transition: transform .2s, box-shadow .2s; animation: bob 4s ease-in-out infinite; animation-delay: calc(var(--i) * -.7s); }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.sec .ic svg { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sec b { font-size: 34px; font-weight: 800; color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 60%, transparent); }
.sec .tx { padding: 6px 12px; margin: 0 -8px; border-radius: 12px; background: rgba(27,36,53,0.78); border: 1px solid rgba(255,255,255,0.08); }
.sec em, .legend em { display: inline-block; padding: 2px 10px; border-radius: 10px; border: 1px solid rgba(245,160,74,0.7); background: rgba(245,160,74,0.12); font-style: normal; font-size: 14px; font-weight: 700; letter-spacing: 0.03em; color: #F5A04A; }
.sec em { margin-top: 6px; }
.sec:hover .ic, .sec.on .ic { transform: scale(1.14); box-shadow: 0 0 0 6px rgba(27,36,53,0.85), 0 0 44px var(--c), inset 0 1px 0 rgba(255,255,255,0.18); }
.hub { position: absolute; left: -130px; bottom: 26px; width: 260px; box-sizing: border-box; padding: 14px 10px 14px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.22); background: linear-gradient(180deg, rgba(47,63,90,0.92), rgba(21,28,42,0.92)); box-shadow: 0 0 60px rgba(255,45,70,0.35), 0 24px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18); display: flex; flex-direction: column; align-items: center; text-align: center; animation: pop .7s 1.2s cubic-bezier(.2,1.4,.4,1) both; }
.hub i { width: 54px; height: 54px; border-radius: 50%; background: #C8102E; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9), 0 0 24px rgba(255,45,70,0.7); }
.hub b { margin-top: 8px; font-size: 27px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
.hub span { margin-top: 4px; font-size: 13px; line-height: 1.25; color: #A7B2C2; }
.beam { position: absolute; left: -90px; bottom: 0; width: 180px; height: 300px; background: linear-gradient(0deg, rgba(255,84,104,0.2), rgba(255,84,104,0)); clip-path: polygon(38% 100%, 62% 100%, 100% 0, 0 0); animation: show 1.2s 1.4s both; opacity: 0; }

/* вступление текста */
h1, .lead, .year, .bar, .legend { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }
h1 { animation-delay: .15s; } .lead { animation-delay: .4s; } .year { animation-delay: .6s; } .bar { animation-delay: .8s; } .legend { animation-delay: 3.4s; }
@keyframes up { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }
h1 { background: linear-gradient(100deg, #ffffff 0 40%, #9fd8ff 50%, #ffffff 60% 100%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: up .9s .15s cubic-bezier(.2,.7,.2,1) both, sheen 6s 3s ease-in-out infinite; }
@keyframes sheen { 0%, 60% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
</style>
</head>

<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')'; }
  addEventListener('resize', fit); fit();
  document.getElementById('full').onclick = function () { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
  // наведение на раздел подсвечивает его и вкладку в шапке
  var items = [].slice.call(document.querySelectorAll('[data-s]'));
  function pick(s) { items.forEach(function (e) { e.classList.toggle('on', e.dataset.s === s); }); }
  items.forEach(function (e) { e.onmouseenter = e.onfocus = function () { pick(e.dataset.s); }; e.onmouseleave = e.onblur = function () { pick(''); }; });
})();
