<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Результаты работы — цифровизация ресурсоснабжения Москвы</title>
<!--FONTS-->
<style>
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #0d1118; color: #ffffff; font-family: 'Onest', system-ui, sans-serif; }
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #8FB4F0; outline-offset: 2px; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #1b2435; transform-origin: center center; }

/* геоподложка: карта Москвы, центр города совпадает с центром круга */
.geo { position: absolute; left: 246px; top: -5px; width: 2000px; height: 1175px; mix-blend-mode: lighten; filter: brightness(1.35) saturate(0.8); opacity: 0.6; }
.shade { position: absolute; inset: 0; background:
  radial-gradient(circle 190px at 1290px 545px, rgba(27,36,53,0.78) 40%, rgba(27,36,53,0) 100%),
  linear-gradient(180deg, #1b2435 0, rgba(27,36,53,0.9) 130px, rgba(27,36,53,0) 230px),
  radial-gradient(ellipse 640px 620px at 1290px 545px, rgba(27,36,53,0) 42%, rgba(27,36,53,0.7) 72%, #1b2435 100%),
  linear-gradient(90deg, #1b2435 0, #1b2435 600px, rgba(27,36,53,0) 900px); }

.logos { position: absolute; left: 82px; top: 36px; height: 60px; display: flex; align-items: center; gap: 36px; }
.logo { display: flex; align-items: center; gap: 12px; font-weight: 800; line-height: 1; }
.logo i { flex: none; display: block; }
.logo.cgu { font-size: 32px; letter-spacing: 0.04em; }
.logo.cgu i { width: 34px; height: 40px; background: #FF2D46; clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 78%, 62% 100%, 0 100%); }
.logo.mos { font-size: 21px; line-height: 0.95; }
.logo.mos i { width: 56px; height: 56px; border-radius: 50%; background: #C8102E; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9); }

.tabs { position: absolute; left: 476px; right: 46px; top: 44px; height: 82px; display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid rgba(255,255,255,0.14); }
.tab { position: relative; padding: 0; border: 0; background: none; text-align: left; display: flex; gap: 12px; align-items: flex-start; }
.tab svg { flex: none; margin-top: 8px; fill: none; stroke: #A7B2C2; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab small { display: block; font-size: 14px; color: #8794A8; }
.tab b { display: block; margin-top: 6px; font-size: 16px; font-weight: 700; color: #C5CEDB; white-space: nowrap; }
.tab::after { content: ''; position: absolute; left: 118px; bottom: -4px; width: 7px; height: 7px; border-radius: 50%; background: #4A586E; }
.tab:hover b, .tab.on b { color: #ffffff; }
.tab.on::after { background: #5FD6A2; box-shadow: 0 0 10px rgba(95,214,162,0.9); }

h1 { position: absolute; left: 82px; top: 272px; margin: 0; font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
.lead { position: absolute; left: 82px; top: 468px; width: 600px; margin: 0; font-size: 44px; line-height: 1.24; color: #C5CEDB; }
.year { position: absolute; left: 82px; top: 658px; margin: 0; font-size: 30px; color: #C5CEDB; }
.year b { color: #ffffff; font-weight: 800; }
.bar { position: absolute; left: 82px; top: 734px; width: 92px; height: 9px; background: #FF2D46; transform: skewX(-32deg); }
.legend { position: absolute; left: 82px; top: 884px; display: flex; gap: 30px; font-size: 16px; color: #A7B2C2; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 20px; height: 3px; border-radius: 2px; }

.pill { position: absolute; top: 984px; height: 62px; box-sizing: border-box; border-radius: 31px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: center; font-size: 21px; color: #C5CEDB; }
.tools { position: absolute; right: 82px; top: 980px; height: 70px; display: flex; align-items: center; gap: 22px; font-size: 16px; color: #A7B2C2; }
.tools button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; }
.tools button:hover { background: rgba(255,255,255,0.1); }
.tools svg { fill: none; stroke: #C5CEDB; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tools .nav { width: 140px; height: 70px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.22); background: rgba(29,38,54,0.88); display: flex; align-items: center; justify-content: space-around; }

/* инженерная структура: узлы-разделы, связи по ресурсам, ядро */
.net { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.net path { fill: none; stroke-linecap: round; transition: opacity .25s; }
.net .base { stroke-width: 3; opacity: 0.38; }
.net .run { stroke-width: 3; stroke-dasharray: 14 22; animation: run 1.6s linear infinite; }
.net .data { stroke: #5FD6A2; stroke-width: 2; stroke-dasharray: 2 10; opacity: 0.8; animation: data 1.2s linear infinite; }
@keyframes run { to { stroke-dashoffset: -36; } }
@keyframes data { to { stroke-dashoffset: -12; } }
.net .tag { transition: opacity .25s; }
.net .tag rect { fill: #1b2435; stroke-width: 1; }
.net .tag text { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-anchor: middle; }
.net.sel .lk:not(.hit) { opacity: 0.12; }
.hub { position: absolute; left: 1180px; top: 435px; width: 220px; height: 220px; box-sizing: border-box; border-radius: 50%; border: 1px solid rgba(255,255,255,0.28); background: radial-gradient(circle at 50% 35%, #2a3850 0%, #151c2a 78%); box-shadow: 0 0 50px rgba(255,45,70,0.25), inset 0 1px 0 rgba(255,255,255,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hub i { width: 58px; height: 58px; border-radius: 50%; background: #C8102E; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9); }
.hub b { margin-top: 10px; font-size: 25px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
.hub span { margin-top: 6px; font-size: 13px; line-height: 1.25; color: #A7B2C2; }
.sec { position: absolute; padding: 0; border: 0; background: none; display: flex; align-items: center; gap: 16px; text-align: left; font-size: 24px; line-height: 1.22; color: #ffffff; white-space: nowrap; transform: translate(-40px, -50%); }
.sec.l { flex-direction: row-reverse; text-align: right; transform: translate(40px, -50%); }
.sec .ic { flex: none; width: 80px; height: 80px; box-sizing: border-box; border-radius: 50%; border: 2px solid #5FD6A2; background: radial-gradient(circle at 50% 30%, #2a3850 0%, #151c2a 80%); box-shadow: 0 0 0 7px rgba(27,36,53,0.9), 0 0 22px rgba(95,214,162,0.35); display: flex; align-items: center; justify-content: center; transition: transform .2s, box-shadow .2s; }
.sec .ic svg { fill: none; stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sec b { font-size: 36px; font-weight: 800; color: #5FD6A2; }
.sec.plan b { color: #F5A04A; }
.sec.plan .ic { border-color: #F5A04A; box-shadow: 0 0 0 7px rgba(27,36,53,0.9), 0 0 22px rgba(245,160,74,0.35); }
.sec .tx { padding: 6px 10px; margin: 0 -10px; border-radius: 10px; background: rgba(27,36,53,0.72); }
.sec:hover .ic, .sec.on .ic { transform: scale(1.12); box-shadow: 0 0 0 7px rgba(27,36,53,0.9), 0 0 34px rgba(95,214,162,0.8); }
.sec.plan:hover .ic, .sec.plan.on .ic { box-shadow: 0 0 0 7px rgba(27,36,53,0.9), 0 0 34px rgba(245,160,74,0.8); }
.links { position: absolute; left: 82px; top: 836px; display: flex; gap: 26px; font-size: 16px; color: #A7B2C2; }
.links span { display: flex; align-items: center; gap: 10px; }
.links i { width: 20px; height: 3px; border-radius: 2px; }
</style>
</head>
<body>
<div id="stage">
  <img class="geo" src="img/moscow-base.svg" alt="">
  <div class="shade"></div>

  <div class="logos">

  <nav class="tabs">

    <button class="tab" data-s="5"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9.500 12h6M9.500 16h6"/></svg><span><small>05</small><b>АРМ КСИО</b></span></button>

  <button class="sec" data-s="4" style="left: 1290px; top: 850px"><span class="ic"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M3 9h7v6H3zM14 9h7v6h-7zM10 12h4M12 12V5M9.500 5h5"/></svg></span><b>04</b><span class="tx">Анализ территории<br>Газоснабжение</span></button>

<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')'; }
  addEventListener('resize', fit); fit();
  document.getElementById('full').onclick = function () { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
  // наведение на раздел подсвечивает его, вкладку в шапке и его связи; остальные связи гаснут
  var items = [].slice.call(document.querySelectorAll('[data-s]')), net = document.querySelector('.net');
  var links = [].slice.call(document.querySelectorAll('.lk'));
  function pick(s) {
    items.forEach(function (e) { e.classList.toggle('on', e.dataset.s === s); });
    net.classList.toggle('sel', !!s);
    links.forEach(function (l) { l.classList.toggle('hit', !!s && l.dataset.n.split(' ').indexOf(s) >= 0); });
  }
  items.forEach(function (e) { e.onmouseenter = e.onfocus = function () { pick(e.dataset.s); }; e.onmouseleave = e.onblur = function () { pick(''); }; });
})();
</script>
